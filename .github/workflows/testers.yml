name: Invitar testers

# Crea el grupo externo de TestFlight con enlace público, añade la última compilación y la envía a revisión.
# Se lanza a mano: pestaña Actions → Invitar testers → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invitar:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Crear el grupo y enviar a revisión
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          CUERPO=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d '[:space:]')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$CUERPO" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          export ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_PATH="$KEY" GRUPO="Testers Moon"
          export FASTLANE_SKIP_UPDATE_CHECK=1 FASTLANE_HIDE_CHANGELOG=1 FASTLANE_OPT_OUT_USAGE=1 LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          command -v fastlane >/dev/null || brew install fastlane
          fastlane ios invitar
          rm -f "$KEY"
