name: Probar guardado nativo

# Ejecuta las pruebas automáticas del guardado de video rápido en un Mac de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: Pruebas
        working-directory: ios/MoonExportTests
        run: swift test 2>&1 | tail -150
