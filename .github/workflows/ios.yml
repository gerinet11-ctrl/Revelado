name: App de iPhone

# Compila Moon en un Mac de GitHub. Con «subir» marcado, además la firma y la envía a TestFlight.
# Se lanza a mano: pestaña Actions → App de iPhone → Run workflow.
on:
  workflow_dispatch:
    inputs:
      subir:
        description: "Subir a TestFlight (si no, solo comprueba que compila)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Comprobar que compila
        if: ${{ !inputs.subir }}
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Crear el archivo de la app
        if: ${{ inputs.subir }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Moon.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Firmar y subir a TestFlight
        if: ${{ inputs.subir }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Comprueba la forma de cada secreto sin mostrar su contenido.
          mal=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v en Settings → Secrets and variables → Actions"; mal=1; fi
          done
          ok() { printf '%s' "$1" | tr -d '[:space:]' | grep -Eq "$2"; }
          if [ -n "$ASC_KEY_ID" ] && ! ok "$ASC_KEY_ID" '^[A-Z0-9]{10}$'; then echo "::error::ASC_KEY_ID no tiene la forma esperada (10 letras mayúsculas y números)"; mal=1; fi
          if [ -n "$APPLE_TEAM_ID" ] && ! ok "$APPLE_TEAM_ID" '^[A-Z0-9]{10}$'; then echo "::error::APPLE_TEAM_ID no tiene la forma esperada (10 letras mayúsculas y números)"; mal=1; fi
          if [ -n "$ASC_ISSUER_ID" ] && ! ok "$ASC_ISSUER_ID" '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then echo "::error::ASC_ISSUER_ID no tiene la forma esperada (código largo con cuatro guiones)"; mal=1; fi
          if [ -n "$ASC_KEY_P8" ] && ! printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then echo "::error::ASC_KEY_P8 no contiene el texto del archivo .p8 (debe empezar por -----BEGIN PRIVATE KEY-----)"; mal=1; fi
          if [ -n "$ASC_KEY_P8" ] && ! printf '%s' "$ASC_KEY_P8" | grep -q 'END PRIVATE KEY'; then echo "::error::ASC_KEY_P8 está incompleto (debe terminar por -----END PRIVATE KEY-----)"; mal=1; fi
          [ "$mal" = 0 ] || exit 1
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]'); ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]'); APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          echo "Los cuatro secretos tienen la forma correcta."
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Recompone la clave: al copiarla (sobre todo desde Windows) cambian los saltos de línea y Apple la rechaza.
          CUERPO=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d '[:space:]')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$CUERPO" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          RAROS=$(printf '%s' "$CUERPO" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')
          echo "Clave: ${#CUERPO} caracteres en el cuerpo (lo normal son unos 200), $RAROS que no pertenecen a una clave."
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then echo "::error::ASC_KEY_P8 no es una clave válida: vuelve a copiar el archivo .p8 completo, sin cambiar nada"; exit 1; fi
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Moon.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"
